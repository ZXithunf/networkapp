# CI/CD for NetPulse
#   pull request   -> lint + test
#   push to main   -> lint + test -> build, smoke-test, push to ECR -> deploy to EC2 via SSM
#
# AWS access uses GitHub OIDC: no AWS keys are stored in GitHub.
# Set these under Settings -> Secrets and variables -> Actions -> Variables:
#   AWS_REGION       e.g. eu-west-2
#   AWS_ROLE_ARN     IAM role GitHub assumes, e.g. arn:aws:iam::123456789012:role/netpulse-github
#   ECR_REPOSITORY   e.g. netpulse
#   EC2_INSTANCE_ID  e.g. i-0123456789abcdef0

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that talk to AWS add id-token: write.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --cov=app --cov-fail-under=80

  build:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t "${{ steps.meta.outputs.image }}" .

      - name: Smoke test the image
        # Prove the container starts and serves this exact version before shipping it.
        run: |
          docker run -d --name smoke -p 8000:8000 "${{ steps.meta.outputs.image }}"
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health | grep -q '"version":"${{ github.sha }}"'; then
              echo "Smoke test passed"; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Push to ECR
        run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production # optional approval gate; also scopes the OIDC subject
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never kill a deploy halfway through
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy script on the instance via SSM
        run: |
          # Prepend the variables, then send scripts/deploy-ec2.sh as one SSM command.
          script="$(printf 'IMAGE=%s\nAWS_REGION=%s\nVERSION=%s\n' "$IMAGE" "$AWS_REGION" "$GITHUB_SHA"; cat scripts/deploy-ec2.sh)"
          params="$(jq -n --arg s "$script" '{commands: [$s]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "NetPulse ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command id: $command_id"

          # Poll until the command finishes (up to 5 minutes).
          status=Pending
          for _ in $(seq 1 60); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "Status: $status"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          test "$status" = Success
